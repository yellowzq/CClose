name: Build and Release

on:
  # Tag push (e.g. `git tag v0.1.0 && git push --tags`) builds and publishes a
  # GitHub Release with the exe attached.
  push:
    tags:
      - 'v*'
  # Manual trigger (Actions tab → "Run workflow") builds the current branch and
  # uploads the exe as an artifact; no Release is created on non-tag refs.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
              echo "release tag '$GITHUB_REF_NAME' must look like vX.Y.Z or vX.Y.Z-suffix"; exit 1; }
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify version sources
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          v=$(tr -d '\r\n' < src/VERSION)
          test "$v" = "${{ steps.version.outputs.value }}"
          grep -q "\"FileVersion\", \"$v\"" assets/app.rc
          grep -q "\"ProductVersion\", \"$v\"" assets/app.rc
          base=${v%%-*}
          IFS=. read -r major minor patch <<< "$base"
          grep -q "FILEVERSION $major,$minor,$patch,0" assets/app.rc
          grep -q "PRODUCTVERSION $major,$minor,$patch,0" assets/app.rc

      - name: Install Zig
        # v2 supports Zig 0.17.1; v1.x mirrors return 404 for it.
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Build (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe "-Dversion=${{ steps.version.outputs.value }}"

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: CClose-exe
          path: zig-out/bin/CClose.exe

      - name: Publish Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: zig-out/bin/CClose.exe
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
